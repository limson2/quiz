function render(){if(index>=questions.length){$('finalScore').textContent=score+'점';show('write');return}$('progress').textContent=`문제 ${index+1} / 5`;$('runningScore').textContent=score+'점';$('fill').style.width=((index+1)/5*100)+'%';$('question').textContent=questions[index].q;show('quiz')}
$('startBtn').onclick=()=>{nick=$('nickname').value.trim();if(!nick){alert('닉네임을 입력해 주세요!');return}index=0;score=0;answers=[];render()};
function answer(value){let correct=questions[index].a===value;answers[index]=value?'O':'X';show('feedback');$('feedbackIcon').textContent=correct?'🌟':'💡';$('feedbackTitle').textContent=correct?'정답이에요!':'아쉬워요!';$('feedbackText').textContent=correct?'보물상자를 골라 점수를 획득하세요!':`정답은 ${questions[index].a?'O':'X'}입니다.`;$('chestArea').classList.toggle('hidden',!correct);$('next').classList.toggle('hidden',correct);$('reward').textContent='';chosen=false;document.querySelectorAll('.chest').forEach(b=>{b.disabled=false;b.textContent='🎁'});}
$('yes').onclick=()=>answer(true);$('no').onclick=()=>answer(false);
document.querySelectorAll('.chest').forEach((b,i)=>b.onclick=()=>{if(chosen)return;chosen=true;let reward=[10,20,30][Math.floor(Math.random()*3)];score+=reward;document.querySelectorAll('.chest').forEach((c,j)=>{c.disabled=true;if(i===j)c.textContent='💎'});$('reward').textContent=`+${reward}점! ✨`;$('next').classList.remove('hidden')});
$('next').onclick=()=>{index++;render()};
function configured(){return SCRIPT_URL.startsWith('https://script.google.com/macros/s/')&&SCRIPT_URL.endsWith('/exec')}
async function request(payload){const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});const data=await r.json();if(!data.ok)throw new Error(data.error||'서버 오류');return data}
$('save').onclick=async()=>{let advantage=$('advantage').value.trim();if(!advantage){alert('우리 학교의 장점을 적어 주세요!');return}if(!configured()){$('saveStatus').textContent='먼저 index.html의 SCRIPT_URL에 구글 앱스 스크립트 주소를 입력해 주세요.';return}let btn=$('save');btn.disabled=true;$('saveStatus').textContent='저장하는 중이에요…';try{await request({action:'save',nickname:nick,score,advantage,answers});$('myResult').textContent=`${nick} · ${score}점`; $('myAdvantage').textContent=`내가 생각하는 장점: ${advantage}`;$('saveStatus').textContent='';selectTab('scores');show('results');await load()}catch(e){$('saveStatus').textContent='저장 실패: '+e.message+' · 연결과 배포 설정을 확인해 주세요.'}finally{btn.disabled=false}};
let currentTab='scores';
function selectTab(tab){currentTab=tab;const scores=tab==='scores';$('scoresPanel').classList.toggle('hidden',!scores);$('advantagesPanel').classList.toggle('hidden',scores);$('tabScores').classList.toggle('active',scores);$('tabAdvantages').classList.toggle('active',!scores);$('tabScores').setAttribute('aria-selected',String(scores));$('tabAdvantages').setAttribute('aria-selected',String(!scores));}
$('tabScores').onclick=()=>selectTab('scores');$('tabAdvantages').onclick=()=>selectTab('advantages');
function addEntry(container,title,detail,points){const d=document.createElement('div');d.className='entry';const h=document.createElement('strong');h.textContent=title;d.append(h);if(points!==undefined){const badge=document.createElement('span');badge.className='tag';badge.style.float='right';badge.textContent=points+'점';d.append(badge)}if(detail){const p=document.createElement('p');p.textContent=detail;p.style.marginBottom='0';d.append(p)}container.append(d)}
async function load(){$('loadStatus').textContent='기록을 불러오는 중…';$('scoreEntries').replaceChildren();$('advantageEntries').replaceChildren();try{const response=await fetch(SCRIPT_URL,{method:'GET',redirect:'follow'});const data=await response.json();if(!data.ok)throw new Error(data.error||'서버 오류');let rows=(data.results||[]).sort((a,b)=>Number(b.score)-Number(a.score));$('loadStatus').textContent=`총 ${rows.length}개의 기록`;rows.forEach((r,i)=>{addEntry($('scoreEntries'),`${i+1}위 · ${r.nickname||'익명'}`,'',Number(r.score));addEntry($('advantageEntries'),`💜 ${r.nickname||'익명'}`,r.advantage||'')});if(!rows.length){$('scoreEntries').textContent='아직 등록된 기록이 없어요.';$('advantageEntries').textContent='아직 등록된 장점이 없어요.'}}catch(e){$('loadStatus').textContent='기록을 불러오지 못했어요: '+e.message}}
$('refresh').onclick=load;$('restart').onclick=()=>{ $('advantage').value='';show('start')};
</script></body></html>
